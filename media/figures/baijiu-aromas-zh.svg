<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="f7t f7d">
  <title id="f7t">白酒香型的四个基础与七个衍生</title>
  <desc id="f7d">示意图：浓香、酱香、清香、米香为四个基础香型，凤香、兼香、特香、芝麻香、馥郁香、老白干香、豉香等为在此基础上形成的衍生香型。</desc>
  <rect width="860" height="500" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, 'Songti SC', serif" font-size="22" fill="#2b2118">白酒香型：四个基础，若干衍生</text>
  <text x="40" y="70" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#6b5b4a">香型描述风格倾向，不是质量等级；同一香型内部差异同样很大</text>

  <g font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#2b2118">
    <rect x="40" y="96" width="230" height="66" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="60" y="124" font-size="15">浓香</text>
    <text x="60" y="146" font-size="11" fill="#5a4a35">泥窖固态发酵 · 己酸乙酯为主</text>

    <rect x="40" y="182" width="230" height="66" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="60" y="210" font-size="15">酱香</text>
    <text x="60" y="232" font-size="11" fill="#5a4a35">高温制曲与堆积 · 多轮次取酒</text>

    <rect x="40" y="268" width="230" height="66" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="60" y="296" font-size="15">清香</text>
    <text x="60" y="318" font-size="11" fill="#5a4a35">地缸分离发酵 · 乙酸乙酯为主</text>

    <rect x="40" y="354" width="230" height="66" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="60" y="382" font-size="15">米香</text>
    <text x="60" y="404" font-size="11" fill="#5a4a35">小曲 · 半固态发酵 · 大米原料</text>
  </g>

  <g font-family="Georgia, 'Songti SC', serif" font-size="12" fill="#2b2118">
    <rect x="360" y="96" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="376" y="118" font-size="13">凤香</text><text x="376" y="137" font-size="10" fill="#5a4a35">土窖 · 酒海贮存</text>

    <rect x="360" y="160" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="376" y="182" font-size="13">兼香</text><text x="376" y="201" font-size="10" fill="#5a4a35">浓香与酱香并置</text>

    <rect x="360" y="224" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="376" y="246" font-size="13">特香</text><text x="376" y="265" font-size="10" fill="#5a4a35">整粒大米 · 大曲</text>

    <rect x="360" y="288" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="376" y="310" font-size="13">芝麻香</text><text x="376" y="329" font-size="10" fill="#5a4a35">高温堆积 · 焙炒香气</text>

    <rect x="360" y="352" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="376" y="374" font-size="13">馥郁香</text><text x="376" y="393" font-size="10" fill="#5a4a35">一口三香 · 小曲大曲并用</text>

    <rect x="610" y="160" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="626" y="182" font-size="13">老白干香</text><text x="626" y="201" font-size="10" fill="#5a4a35">地缸 · 小麦曲</text>

    <rect x="610" y="224" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="626" y="246" font-size="13">药香（董香）</text><text x="626" y="265" font-size="10" fill="#5a4a35">大小曲并用 · 加中药材</text>

    <rect x="610" y="288" width="210" height="52" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="626" y="310" font-size="13">豉香</text><text x="626" y="329" font-size="10" fill="#5a4a35">肥肉酿浸 · 玉冰烧</text>
  </g>

  <g stroke="#b9a888" stroke-width="1.4" fill="none">
    <path d="M270 190 C320 190 320 122 355 122"/>
    <path d="M270 200 C330 200 330 186 355 186"/>
    <path d="M270 220 C330 220 330 250 355 250"/>
    <path d="M270 290 C320 290 320 314 355 314"/>
    <path d="M270 380 C330 380 330 378 355 378"/>
    <path d="M570 186 C590 186 590 186 605 186"/>
    <path d="M570 250 C590 250 590 250 605 250"/>
    <path d="M570 314 C590 314 590 314 605 314"/>
  </g>

  <g font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#5a4a35">
    <text x="40" y="452">读法：先认基础香型，再看工艺与产地；衍生香型多由基础香型的工艺组合而来。</text>
    <text x="40" y="474">国家标准给出的是术语与质量要求，不等于品质排序；“越陈越香”也只适用于部分香型。</text>
  </g>
  <text x="820" y="490" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f" text-anchor="end">本站自绘示意图 · CC BY 4.0</text>
</svg>
