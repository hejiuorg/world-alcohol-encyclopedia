<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="f5t f5d">
  <title id="f5t">啤酒酿造的六个基本阶段</title>
  <desc id="f5d">流程图：制麦、糖化、煮沸加酒花、发酵、熟成、灌装，并标出糖化与发酵两个决定风味的关键节点。</desc>
  <rect width="860" height="330" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, 'Songti SC', serif" font-size="22" fill="#2b2118">从麦粒到一杯啤酒</text>
  <text x="40" y="70" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#6b5b4a">顺序固定，变量在温度、时间与原料比例</text>

  <g font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#2b2118" text-anchor="middle">
    <rect x="40" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="95" y="150">制麦</text><text x="95" y="172" font-size="11" fill="#6b5b4a">发芽·烘干</text>

    <rect x="180" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="235" y="150">糖化</text><text x="235" y="172" font-size="11" fill="#6b5b4a">淀粉转糖</text>

    <rect x="320" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="375" y="150">煮沸</text><text x="375" y="172" font-size="11" fill="#6b5b4a">加酒花·杀菌</text>

    <rect x="460" y="120" width="110" height="72" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="515" y="150">发酵</text><text x="515" y="172" font-size="11" fill="#8c2f1f">酵母产酒精</text>

    <rect x="600" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="655" y="150">熟成</text><text x="655" y="172" font-size="11" fill="#6b5b4a">澄清·稳定</text>

    <rect x="740" y="120" width="80" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="780" y="150">灌装</text><text x="780" y="172" font-size="11" fill="#6b5b4a">包装</text>
  </g>

  <g stroke="#8c2f1f" stroke-width="2" fill="none">
    <line x1="152" y1="156" x2="172" y2="156"/><polygon points="172,151 182,156 172,161" fill="#8c2f1f"/>
    <line x1="292" y1="156" x2="312" y2="156"/><polygon points="312,151 322,156 312,161" fill="#8c2f1f"/>
    <line x1="432" y1="156" x2="452" y2="156"/><polygon points="452,151 462,156 452,161" fill="#8c2f1f"/>
    <line x1="572" y1="156" x2="592" y2="156"/><polygon points="592,151 602,156 592,161" fill="#8c2f1f"/>
    <line x1="712" y1="156" x2="732" y2="156"/><polygon points="732,151 742,156 732,161" fill="#8c2f1f"/>
  </g>

  <g font-family="Georgia, 'Songti SC', serif" font-size="12" fill="#5a4a35">
    <text x="40" y="238">关键点一：糖化温度决定可发酵糖比例——低温更干，高温更甜、酒体更厚。</text>
    <text x="40" y="262">关键点二：艾尔用上面酵母（约 18–22°C），拉格用下面酵母（约 8–13°C），熟成时间也不同。</text>
    <text x="40" y="286">酒花的加入时机影响苦度与香气：早加出苦，晚加或干投出香。</text>
  </g>
  <text x="820" y="316" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f" text-anchor="end">本站自绘示意图 · CC BY 4.0</text>
</svg>
