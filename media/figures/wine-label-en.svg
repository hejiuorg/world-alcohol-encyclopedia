<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="f3t f3d">
  <title id="f3t">Where the information sits on a wine label</title>
  <desc id="f3d">Diagram: eight common positions on a French AOC wine label — estate name, appellation, classification, vintage, varietal or cuvée name, alcohol and volume, bottling statement, and allergen warning.</desc>
  <rect width="860" height="520" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="22" fill="#2b2118">What to read first on a front label</text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="13" fill="#6b5b4a">Items marked * are mandatory, or conditionally mandatory, under EU rules</text>

  <rect x="70" y="110" width="300" height="370" rx="4" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
  <g font-family="Georgia, serif" fill="#2b2118" text-anchor="middle">
    <text x="220" y="160" font-size="12" fill="#8a7a5f">CHÂTEAU</text>
    <text x="220" y="190" font-size="19">EXAMPLE</text>
    <text x="220" y="214" font-size="11" fill="#8a7a5f">GRAND CRU CLASSÉ</text>
    <line x1="120" y1="232" x2="320" y2="232" stroke="#b9a888"/>
    <text x="220" y="262" font-size="14">MARGAUX</text>
    <text x="220" y="284" font-size="10" fill="#6b5b4a">APPELLATION MARGAUX CONTRÔLÉE *</text>
    <text x="220" y="316" font-size="15">2015</text>
    <text x="220" y="344" font-size="11" fill="#6b5b4a">12.5% vol * · 750 ml *</text>
    <text x="220" y="368" font-size="10" fill="#6b5b4a">MIS EN BOUTEILLE AU CHÂTEAU *</text>
    <text x="220" y="390" font-size="10" fill="#6b5b4a">CONTIENT DES SULFITES *</text>
    <text x="220" y="418" font-size="9" fill="#8a7a5f">L. 26-11-08 · Bordeaux, France</text>
  </g>

  <g font-family="Georgia, serif" font-size="13" fill="#2b2118">
    <g stroke="#8c2f1f" stroke-width="1.2">
      <line x1="370" y1="186" x2="440" y2="150"/><line x1="370" y1="258" x2="440" y2="210"/>
      <line x1="370" y1="280" x2="440" y2="260"/><line x1="370" y1="314" x2="440" y2="310"/>
      <line x1="370" y1="216" x2="440" y2="360"/><line x1="370" y1="342" x2="440" y2="410"/>
      <line x1="370" y1="366" x2="440" y2="456"/><line x1="370" y1="388" x2="440" y2="492"/>
    </g>
    <text x="448" y="154">1 Estate or producer: who made and shipped it</text>
    <text x="448" y="214">2 Appellation: the controlled origin of the grapes</text>
    <text x="448" y="264">3 Classification or site claim: Grand Cru Classé, Premier Cru</text>
    <text x="448" y="314">4 Vintage: only if every drop comes from that year</text>
    <text x="448" y="364">5 Varietal or cuvée name: more common in the New World</text>
    <text x="448" y="414">6 Alcohol and volume: both are mandatory</text>
    <text x="448" y="460">7 Bottling statement: at the estate, in the region, or by a merchant</text>
    <text x="448" y="496">8 Allergen warning: sulphites must normally be declared</text>
  </g>
  <text x="700" y="112" font-family="Georgia, serif" font-size="11" fill="#8a7a5f" text-anchor="end">Original diagram · CC BY 4.0</text>
</svg>
