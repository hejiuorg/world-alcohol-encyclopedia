<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="f8t f8d">
  <title id="f8t">清酒精米步合与常见等级</title>
  <desc id="f8d">示意图：三粒米的截面表示精米步合 70%、60%、50% 的剩余比例，对应对应本酿造、吟酿、大吟酿的常见门槛；纯米表示不添加酿造酒精。</desc>
  <rect width="860" height="400" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, 'Songti SC', serif" font-size="22" fill="#2b2118">精米步合：磨掉多少，剩下多少</text>
  <text x="40" y="70" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#6b5b4a">数字指剩余米粒的比例，不是“磨掉的比例”</text>

  <!-- grain 70 -->
  <g>
    <ellipse cx="160" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="160" cy="200" rx="72" ry="94" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="160" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">70%</text>
    <text x="160" y="222" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">剩余</text>
    <text x="160" y="352" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#2b2118" text-anchor="middle">本酿造</text>
    <text x="160" y="374" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">精米步合 ≤ 70%</text>
  </g>
  <!-- grain 60 -->
  <g>
    <ellipse cx="430" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="430" cy="200" rx="60" ry="78" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="430" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">60%</text>
    <text x="430" y="222" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">剩余</text>
    <text x="430" y="352" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#2b2118" text-anchor="middle">吟酿</text>
    <text x="430" y="374" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">精米步合 ≤ 60%</text>
  </g>
  <!-- grain 50 -->
  <g>
    <ellipse cx="700" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="700" cy="200" rx="50" ry="65" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="700" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">50%</text>
    <text x="700" y="222" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">剩余</text>
    <text x="700" y="352" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#2b2118" text-anchor="middle">大吟酿</text>
    <text x="700" y="374" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#6b5b4a" text-anchor="middle">精米步合 ≤ 50%</text>
  </g>

  <text x="40" y="94" font-family="Georgia, 'Songti SC', serif" font-size="12" fill="#5a4a35">纯米（Junmai）：只用水、米、麹与酵母，不添加酿造酒精；纯米大吟酿同样要求 ≤ 50%。</text>
  <text x="680" y="94" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f" text-anchor="end">本站自绘 · CC BY 4.0</text>
</svg>
