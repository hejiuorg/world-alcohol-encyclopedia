<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">波尔多左右岸与主要村庄示意</title>
  <desc id="f1d">示意图：吉伦特河口把波尔多分成左岸与右岸。左岸以砾石土壤为主，代表村庄有圣埃斯泰夫、波亚克、圣朱利安、玛歌；右岸以黏土与石灰岩为主，代表村庄有圣埃米利永与波美侯。</desc>
  <rect width="860" height="520" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, 'Songti SC', serif" font-size="22" fill="#2b2118">波尔多：一条河口分开两种土壤</text>
  <text x="40" y="70" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#6b5b4a">Bordeaux: two banks, two soil families</text>

  <!-- water -->
  <path d="M470 92 C500 150 520 200 512 260 C506 320 470 372 452 430 C442 466 448 486 452 500 L512 500 C508 470 502 446 514 410 C536 344 566 300 570 244 C574 190 550 132 520 92 Z" fill="#cfe0e6" stroke="#9dbfc9" stroke-width="1.5"/>
  <text x="516" y="300" font-family="Georgia, serif" font-size="12" fill="#4a7080" transform="rotate(90 516 300)">吉伦特河口 Gironde</text>

  <!-- left bank land -->
  <path d="M40 100 L470 92 C500 150 520 200 512 260 C506 320 470 372 452 430 C442 466 448 486 452 500 L40 500 Z" fill="#e8dfcb" stroke="#8a7a5f" stroke-width="1.5"/>
  <!-- right bank land -->
  <path d="M520 92 C550 132 574 190 570 244 C566 300 536 344 514 410 C502 446 508 470 512 500 L820 500 L820 100 Z" fill="#dfe6d5" stroke="#6f8163" stroke-width="1.5"/>

  <text x="70" y="120" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#5a4a35">左岸 · 砾石土（Gravel）</text>
  <text x="600" y="120" font-family="Georgia, 'Songti SC', serif" font-size="14" fill="#3f5238">右岸 · 黏土—石灰岩（Clay–limestone）</text>

  <!-- left bank villages -->
  <g font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#2b2118">
    <circle cx="120" cy="175" r="5" fill="#8c2f1f"/><text x="134" y="180">圣埃斯泰夫 Saint-Estèphe</text>
    <circle cx="165" cy="225" r="5" fill="#8c2f1f"/><text x="179" y="230">波亚克 Pauillac</text>
    <circle cx="150" cy="278" r="5" fill="#8c2f1f"/><text x="164" y="283">圣朱利安 Saint-Julien</text>
    <circle cx="118" cy="330" r="5" fill="#8c2f1f"/><text x="132" y="335">玛歌 Margaux</text>
    <circle cx="96" cy="392" r="5" fill="#8c2f1f"/><text x="110" y="397">佩萨克—雷奥良 Pessac-Léognan</text>
  </g>
  <!-- right bank villages -->
  <g font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#2b2118">
    <circle cx="648" cy="250" r="5" fill="#4a6b52"/><text x="662" y="255">圣埃米利永 Saint-Émilion</text>
    <circle cx="700" cy="310" r="5" fill="#4a6b52"/><text x="714" y="315">波美侯 Pomerol</text>
    <circle cx="672" cy="382" r="5" fill="#4a6b52"/><text x="686" y="387">卡斯蒂永 Castillon</text>
  </g>

  <!-- hierarchy notes -->
  <g font-family="Georgia, 'Songti SC', serif" font-size="12" fill="#5a4a35">
    <text x="70" y="448">1855 分级只覆盖左岸红葡萄酒（另有苏玳甜白）：</text>
    <text x="70" y="468">一级庄 5 家：波亚克 3 家、玛歌 1 家、格拉夫 1 家（奥比良）。</text>
    <text x="70" y="488">右岸从未参加 1855 分级，圣埃米利永有自己的定期分级。</text>
  </g>
  <text x="600" y="470" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f">本站自绘示意图，非测绘地图</text>
  <text x="600" y="488" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f">Original diagram · CC BY 4.0</text>
</svg>
