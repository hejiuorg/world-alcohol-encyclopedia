<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="f8t f8d">
  <title id="f8t">Sake polishing ratios and the grades they define</title>
  <desc id="f8d">Diagram: three rice cross-sections showing 70, 60 and 50 percent of the grain remaining, the thresholds commonly used for honjozo, ginjo and daiginjo. Junmai means no added brewer's alcohol.</desc>
  <rect width="860" height="400" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="22" fill="#2b2118">Polishing ratio: how much rice is left</text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="13" fill="#6b5b4a">The figure is what remains, not what is ground away</text>

  <g>
    <ellipse cx="160" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="160" cy="200" rx="72" ry="94" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="160" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">70%</text>
    <text x="160" y="222" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">remaining</text>
    <text x="160" y="352" font-family="Georgia, serif" font-size="14" fill="#2b2118" text-anchor="middle">Honjozo</text>
    <text x="160" y="374" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">ratio ≤ 70%</text>
  </g>
  <g>
    <ellipse cx="430" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="430" cy="200" rx="60" ry="78" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="430" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">60%</text>
    <text x="430" y="222" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">remaining</text>
    <text x="430" y="352" font-family="Georgia, serif" font-size="14" fill="#2b2118" text-anchor="middle">Ginjo</text>
    <text x="430" y="374" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">ratio ≤ 60%</text>
  </g>
  <g>
    <ellipse cx="700" cy="200" rx="86" ry="112" fill="#f3ead6" stroke="#8a7a5f" stroke-width="2"/>
    <ellipse cx="700" cy="200" rx="50" ry="65" fill="none" stroke="#d8c7a4" stroke-dasharray="4 4"/>
    <text x="700" y="196" font-family="Georgia, serif" font-size="30" fill="#8c2f1f" text-anchor="middle">50%</text>
    <text x="700" y="222" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">remaining</text>
    <text x="700" y="352" font-family="Georgia, serif" font-size="14" fill="#2b2118" text-anchor="middle">Daiginjo</text>
    <text x="700" y="374" font-family="Georgia, serif" font-size="11" fill="#6b5b4a" text-anchor="middle">ratio ≤ 50%</text>
  </g>

  <text x="40" y="94" font-family="Georgia, serif" font-size="12" fill="#5a4a35">Junmai: rice, water, koji and yeast only, with no added brewer's alcohol; junmai daiginjo also needs ≤ 50%.</text>
  <text x="680" y="94" font-family="Georgia, serif" font-size="11" fill="#8a7a5f" text-anchor="end">Original diagram · CC BY 4.0</text>
</svg>
