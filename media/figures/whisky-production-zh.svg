<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="f6t f6d">
  <title id="f6t">威士忌酿造的六个阶段</title>
  <desc id="f6d">流程图：制麦、糖化、发酵、蒸馏、橡木桶陈年、装瓶。标注壶式蒸馏与柱式蒸馏的差别，以及“天使分享”在陈年阶段的损耗。</desc>
  <rect width="860" height="330" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, 'Songti SC', serif" font-size="22" fill="#2b2118">威士忌：从发芽大麦到橡木桶</text>
  <text x="40" y="70" font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#6b5b4a">相同的六个阶段，不同的蒸馏器与桶，决定最后的风味</text>

  <g font-family="Georgia, 'Songti SC', serif" font-size="13" fill="#2b2118" text-anchor="middle">
    <rect x="40" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="95" y="150">制麦</text><text x="95" y="172" font-size="11" fill="#6b5b4a">泥煤烟熏可选</text>

    <rect x="180" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="235" y="150">糖化</text><text x="235" y="172" font-size="11" fill="#6b5b4a">热水萃取</text>

    <rect x="320" y="120" width="110" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="375" y="150">发酵</text><text x="375" y="172" font-size="11" fill="#6b5b4a">约 48–72 小时</text>

    <rect x="460" y="120" width="110" height="72" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="515" y="150">蒸馏</text><text x="515" y="172" font-size="11" fill="#8c2f1f">壶式或柱式</text>

    <rect x="600" y="120" width="110" height="72" rx="6" fill="#e6d3b3" stroke="#8c2f1f"/>
    <text x="655" y="150">橡木桶陈年</text><text x="655" y="172" font-size="11" fill="#8c2f1f">至少 3 年</text>

    <rect x="740" y="120" width="80" height="72" rx="6" fill="#efe4cd" stroke="#8a7a5f"/>
    <text x="780" y="150">装瓶</text><text x="780" y="172" font-size="11" fill="#6b5b4a">加水或原桶</text>
  </g>

  <g stroke="#8c2f1f" stroke-width="2" fill="none">
    <line x1="152" y1="156" x2="172" y2="156"/><polygon points="172,151 182,156 172,161" fill="#8c2f1f"/>
    <line x1="292" y1="156" x2="312" y2="156"/><polygon points="312,151 322,156 312,161" fill="#8c2f1f"/>
    <line x1="432" y1="156" x2="452" y2="156"/><polygon points="452,151 462,156 452,161" fill="#8c2f1f"/>
    <line x1="572" y1="156" x2="592" y2="156"/><polygon points="592,151 602,156 592,161" fill="#8c2f1f"/>
    <line x1="712" y1="156" x2="732" y2="156"/><polygon points="732,151 742,156 732,161" fill="#8c2f1f"/>
  </g>

  <g font-family="Georgia, 'Songti SC', serif" font-size="12" fill="#5a4a35">
    <text x="40" y="238">壶式蒸馏：分批蒸馏，通常两次，保留更多酒体与个性，苏格兰麦芽威士忌多用。</text>
    <text x="40" y="262">柱式蒸馏：连续蒸馏，效率高、酒精度高、风格更轻，谷物威士忌与波本常用。</text>
    <text x="40" y="286">“天使分享”：每年约 2% 的酒液经桶壁挥发；苏格兰法规要求橡木桶陈年不少于 3 年。</text>
  </g>
  <text x="820" y="316" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a7a5f" text-anchor="end">本站自绘示意图 · CC BY 4.0</text>
</svg>
