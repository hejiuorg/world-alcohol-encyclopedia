  <title id="f4t">Five common glass shapes and what they do</title>
  <desc id="f4d">Diagram: flute, tulip, coupe, rocks glass and copita, left to right, each labelled with its most common use.</desc>
  <rect width="860" height="440" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="22" fill="#2b2118">Glass shape controls aroma and temperature</text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="13" fill="#6b5b4a">A narrow rim concentrates aroma; a wide bowl lets alcohol dissipate</text>

