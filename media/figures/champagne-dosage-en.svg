<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="f2t f2d">
  <title id="f2t">Champagne sweetness levels by dosage</title>
  <desc id="f2d">Chart: Champagne sweetness terms arranged by dosage in grams per litre, from Brut Nature at 0–3 g/L to Doux above 50 g/L, with the 12 g/L ceiling for Brut marked.</desc>
  <rect width="860" height="380" fill="#faf7f0"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="22" fill="#2b2118">Dosage decides the sweetness term</text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="13" fill="#6b5b4a">Grams of sugar per litre, from bone dry to sweet</text>

  <rect x="40" y="150" width="120" height="54" fill="#f4e3c3" stroke="#8a7a5f"/>
  <rect x="160" y="150" width="120" height="54" fill="#efd9ae" stroke="#8a7a5f"/>
  <rect x="280" y="150" width="140" height="54" fill="#e6c98d" stroke="#8a7a5f"/>
  <rect x="420" y="150" width="120" height="54" fill="#d9b26a" stroke="#8a7a5f"/>
  <rect x="540" y="150" width="130" height="54" fill="#c99a4e" stroke="#8a7a5f"/>
  <rect x="670" y="150" width="150" height="54" fill="#b07d36" stroke="#8a7a5f"/>

  <g font-family="Georgia, serif" font-size="13" fill="#2b2118" text-anchor="middle">
    <text x="100" y="182">Brut Nature</text>
    <text x="220" y="182">Extra Brut</text>
    <text x="350" y="182">Brut</text>
    <text x="480" y="182">Extra Dry</text>
    <text x="605" y="182">Sec</text>
    <text x="745" y="182">Demi-Sec / Doux</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#5a4a35" text-anchor="middle">
    <text x="100" y="228">0–3 g/L</text>
    <text x="220" y="228">0–6 g/L</text>
    <text x="350" y="228">0–12 g/L</text>
    <text x="480" y="228">12–17 g/L</text>
    <text x="605" y="228">17–32 g/L</text>
    <text x="745" y="228">32–50 / 50+ g/L</text>
  </g>

  <line x1="420" y1="128" x2="420" y2="240" stroke="#8c2f1f" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="120" font-family="Georgia, serif" font-size="13" fill="#8c2f1f" text-anchor="middle">Brut ceiling: 12 g/L</text>

  <g font-family="Georgia, serif" font-size="12" fill="#5a4a35">
    <text x="40" y="286">Read the sweetness word first, then the dosage figure. Two “Brut” wines can differ by several grams.</text>
    <text x="40" y="310">Common mistake: treating Brut as sweet. It is usually dry; Demi-Sec is where sweetness becomes obvious.</text>
    <text x="40" y="334">Ranges follow Champagne practice; the back label is the final authority for a given bottle.</text>
  </g>
  <text x="600" y="358" font-family="Georgia, serif" font-size="11" fill="#8a7a5f">Original diagram · CC BY 4.0</text>
</svg>
